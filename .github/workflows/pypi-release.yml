name: PyPI and GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      # Exposes the secret to the step-level `if:` below. Without this, env.PYPI_API_TOKEN was
      # always empty and every tag after 2.0.0 skipped the upload.
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build

      - name: Check the tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$PKG" ]; then echo "Tag $GITHUB_REF_NAME does not match pyproject version $PKG"; exit 1; fi

      - name: Build package
        run: |
          python -m build

      - name: Run tests
        run: |
          python -m pip install .
          pip install pytest
          pytest tests/

      - name: Publish to PyPI
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags') && env.PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

      # GitHub Packages publishing removed due to 404 errors
      # PyPI publishing above is working perfectly
      # Users can install from: pip install dist-gcs-pdf-processing

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Changes since the previous release are listed below (generated from merged PRs).
            
            ## 📦 Installation
            
            ```bash
            pip install --upgrade dist-gcs-pdf-processing
            ```
            
            ## 🔗 Links
            - PyPI: https://pypi.org/project/dist-gcs-pdf-processing/${{ github.ref_name }}/
            - Documentation: See README.md
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false 